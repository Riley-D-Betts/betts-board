name: Deploy

# Deploys to the self-hosted runner in Proxmox CT 108 (10.10.0.31). GitHub-hosted
# runners cannot reach the 10.10.0.0/24 LAN, so self-hosted is the only option.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-betts-board
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, bettsboard]
    timeout-minutes: 25

    steps:
      # Deliberately not actions/checkout: the deploy target is the long-lived
      # working tree at /opt/betts-board (which owns the betts-data volume and
      # any local untracked config), not a fresh checkout under _work.
      - name: Sync working tree
        run: |
          set -euo pipefail
          cd /opt/betts-board
          git fetch --prune origin
          # checkout -B, not reset --hard: the tree may be sitting on some other
          # branch, and a bare reset would drag that branch's pointer to main's
          # commit instead of actually moving onto main.
          git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
          git log --oneline -1

      # No GIT_COMMIT/BUILT_AT build args here (unlike 3pl-market): buildInfo()
      # in nuxt.config.ts shells out to git inside the build stage, and .git is
      # deliberately not in .dockerignore, so the image self-stamps.
      - name: Build and restart
        run: |
          set -euo pipefail
          cd /opt/betts-board
          docker compose up -d --build

      - name: Verify the deploy actually took
        run: |
          set -euo pipefail
          cd /opt/betts-board
          EXPECTED="$(git rev-parse --short HEAD)"

          for i in $(seq 1 30); do
            BODY="$(curl -fsS -m 5 http://127.0.0.1:3000/api/health || true)"
            case "$BODY" in
              *'"ok":true'*) break ;;
            esac
            sleep 5
          done

          echo "health: $BODY"
          case "$BODY" in
            *'"ok":true'*) ;;
            *) echo "::error::app did not come up healthy"; exit 1 ;;
          esac

          # A healthy container is NOT proof of a rebuild — a clean pull plus a
          # healthy container once served a 2-day-old image here. Compare the
          # commit the app reports against the commit we just checked out. A bare
          # {"ok":true} with no commit field means the image predates the stamp.
          ACTUAL="$(printf '%s' "$BODY" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')"
          if [ -z "$ACTUAL" ]; then
            echo "::error::/api/health reports no commit; cannot prove the rebuild took."
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::stale image: serving $ACTUAL, expected $EXPECTED"
            exit 1
          fi
          echo "verified: serving $ACTUAL"

      # Buildkit cache is the main disk consumer here and reached 5.8 GB after two
      # builds, where a tight disk hung `npm ci` for 27 hours.
      - name: Reclaim build cache
        if: always()
        run: |
          docker builder prune -f --max-used-space 2GB
          df -h / | tail -1
