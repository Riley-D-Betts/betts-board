name: Bug report
description: Something on the board is broken or behaving strangely.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What were you doing, what happened, and what did you expect instead?
      placeholder: e.g. Checked off a chore on the wall display, but the star count didn't change.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.0.0"
    validations:
      required: false
  - type: textarea
    id: device
    attributes:
      label: Device info
      description: Browser and window size, if it seems relevant.
      placeholder: |
        Browser: Safari on iPad
        Viewport: 1024×768
    validations:
      required: false
